<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamLoom — PDF Mock Test Portal | SSC CGL, CSIR NET, GATE</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden { display: none !important; }

    header {
      height: 54px;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 700;
      color: #818cf8;
      white-space: nowrap;
    }

    .timer-badge {
      background: var(--red-bg);
      color: var(--red);
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }

    .setup-container {
      max-width: 580px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.25rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
    }

    select, input[type="number"], input[type="file"], textarea {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--red); color: #fff; width: auto; padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    #exam-screen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: calc(100vh - 54px);
      overflow: hidden;
    }

    .pdf-scroll-view {
      background: #334155;
      height: 100%;
      overflow-y: auto;
      overflow-x: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .pdf-page-canvas {
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      background: white;
      max-width: 100%;
      height: auto;
    }

    .sheet-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sheet-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .omr-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.6rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .omr-item.answered {
      border-color: var(--green);
      background: var(--green-bg);
    }

    .omr-index {
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 32px;
    }

    .bubble-row {
      display: flex;
      gap: 0.35rem;
    }

    .bubble {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .bubble.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .sheet-footer {
      padding: 0.75rem;
      border-top: 1px solid var(--border);
      background: #f8fafc;
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin: 1.25rem auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      border: 6px solid var(--primary);
    }

    .score-circle strong { font-size: 2rem; color: var(--primary); }
    .score-circle span { font-size: 0.75rem; color: var(--muted); }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin: 1.25rem 0;
    }

    .stat-card {
      background: #f1f5f9;
      padding: 0.85rem 0.4rem;
      border-radius: 8px;
      text-align: center;
    }

    .stat-card strong {
      display: block;
      font-size: 1.4rem;
    }

    .stat-card span {
      font-size: 0.75rem;
      color: var(--muted);
    }

      width: 100%;
      border-collapse: collapse;
