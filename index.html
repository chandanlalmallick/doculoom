<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamLoom — Mobile & Desktop CBT</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden { display: none !important; }

    /* Top Bar */
    header {
      height: 54px;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 700;
      color: #818cf8;
      max-width: 40%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timer-badge {
      background: var(--red-bg);
      color: var(--red);
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }

    /* Setup Container */
    .setup-container {
      max-width: 520px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
    }

    .setup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .setup-card h1 {
      font-size: 1.3rem;
      margin-bottom: 0.25rem;
    }

    .setup-card p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
    }

    select, input[type="number"], input[type="file"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--red); color: #fff; width: auto; padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    /* Test Split Layout */
    #exam-screen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: calc(100vh - 54px);
      overflow: hidden;
    }

    /* PDF Canvas Viewer */
    .pdf-scroll-view {
      background: #334155;
      height: 100%;
      overflow-y: auto;
      overflow-x: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .pdf-page-canvas {
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      background: white;
      max-width: 100%;
      height: auto;
    }

    /* OMR Sheet Panel */
    .sheet-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sheet-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .omr-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.6rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .omr-item.answered {
      border-color: var(--green);
      background: var(--green-bg);
    }

    .omr-index {
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 32px;
    }

    .bubble-row {
      display: flex;
      gap: 0.35rem;
    }

    .bubble {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .bubble.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .sheet-footer {
      padding: 0.75rem;
      border-top: 1px solid var(--border);
      background: #f8fafc;
    }

    /* Result Panel */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin: 1.5rem 0;
    }

    .stat-card {
      background: #f1f5f9;
      padding: 0.85rem;
      border-radius: 6px;
      text-align: center;
    }

    .stat-card strong {
      display: block;
      font-size: 1.4rem;
    }

    .stat-card span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Mobile Responsive Layout: Top Half PDF, Bottom Half OMR */
    @media (max-width: 800px) {
      .split-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 55% 45%;
      }
      .sheet-panel {
        border-left: none;
        border-top: 2px solid var(--border);
      }
    }
  </style>
</head>
<body>

  <main id="setup-screen" class="setup-container">
    <div class="setup-card">
      <div class="brand" style="margin-bottom: 0.4rem;">ExamLoom</div>
      <h1>Mock Test Setup</h1>
      <p>Choose your exam, duration, and PDF paper.</p>

      <form id="setup-form">
        <div class="form-group">
          <label for="exam-type">Select Exam</label>
          <select id="exam-type" onchange="updatePreset()">
            <option value="CSIR">CSIR NET (180 mins, 60 Qs)</option>
            <option value="GATE">GATE (180 mins, 65 Qs)</option>
            <option value="UPSC">UPSC Prelims (120 mins, 100 Qs)</option>
            <option value="UGC">UGC NET (180 mins, 150 Qs)</option>
            <option value="BANK">Banking PO/Clerk (60 mins, 100 Qs)</option>
            <option value="RRB">Railway RRB (90 mins, 100 Qs)</option>
            <option value="CUSTOM">Custom Setup</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label for="test-time">Duration (Mins)</label>
            <input type="number" id="test-time" min="1" max="360" value="180" required />
          </div>
          <div class="form-group">
            <label for="test-count">Questions</label>
            <input type="number" id="test-count" min="1" max="200" value="60" required />
          </div>
        </div>

        <div class="form-group">
          <label for="file-chooser">Upload PDF Paper</label>
          <input type="file" id="file-chooser" accept="application/pdf,.pdf" required />
        </div>

        <button type="submit" class="btn btn-primary" id="start-btn" style="margin-top: 0.5rem;">
          Start Mock Exam
        </button>
      </form>
    </div>
  </main>

  <section id="exam-screen" class="hidden">
    <header>
      <span id="screen-exam-title" class="brand">Mock Exam</span>
      <div class="timer-badge" id="clock-display">00:00:00</div>
      <button class="btn btn-danger" onclick="endTest(false)">Finish Test</button>
    </header>

    <div class="split-layout">
      <div class="pdf-scroll-view" id="pdf-container">
        <div id="pdf-loading-text" style="color: white; font-weight: 600; margin-top: 2rem;">
          Rendering Question Paper...
        </div>
      </div>

      <aside class="sheet-panel">
        <div class="sheet-header">Answer Sheet</div>
        <div class="sheet-body" id="sheet-items"></div>
        <div class="sheet-footer">
          <button class="btn btn-primary" onclick="endTest(false)">Submit Exam</button>
        </div>
      </aside>
    </div>
  </section>

  <main id="result-screen" class="setup-container hidden">
    <div class="setup-card" style="text-align: center;">
      <h1>Test Complete</h1>
      <p>Performance overview of your mock test.</p>

      <div class="stat-grid">
        <div class="stat-card">
          <strong id="res-attempted">0</strong>
          <span>Attempted</span>
        </div>
        <div class="stat-card">
          <strong id="res-unattempted">0</strong>
          <span>Unattempted</span>
        </div>
        <div class="stat-card">
          <strong id="res-total">0</strong>
          <span>Total Questions</span>
        </div>
        <div class="stat-card">
          <strong id="res-time">0m 0s</strong>
          <span>Time Taken</span>
        </div>
      </div>

      <button class="btn btn-primary" onclick="location.reload()">Start Another Test</button>
    </div>
  </main>

  <script>
    // Set PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

    const PRESETS = {
      CSIR: { time: 180, q: 60, name: "CSIR NET" },
      GATE: { time: 180, q: 65, name: "GATE" },
      UPSC: { time: 120, q: 100, name: "UPSC Prelims" },
      UGC:  { time: 180, q: 150, name: "UGC NET" },
      BANK: { time: 60,  q: 100, name: "Banking CBT" },
      RRB:  { time: 90,  q: 100, name: "Railway RRB" },
      CUSTOM: { time: 60, q: 30, name: "Custom Mock" }
    };

    let userAnswers = {};
    let countdownInterval = null;
    let secondsLeft = 0;
    let initialSeconds = 0;

    function updatePreset() {
      const selection = document.getElementById("exam-type").value;
      const data = PRESETS[selection];
      if (data) {
        document.getElementById("test-time").value = data.time;
        document.getElementById("test-count").value = data.q;
      }
    }

    // Form submission & Canvas Render
    document.getElementById("setup-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const fileField = document.getElementById("file-chooser");
      const file = fileField.files[0];

      if (!file) {
        alert("Please select a PDF file first.");
        return;
      }

      const totalMins = parseInt(document.getElementById("test-time").value, 10);
      const totalQs = parseInt(document.getElementById("test-count").value, 10);
      const examName = PRESETS[document.getElementById("exam-type").value].name;

      const submitBtn = document.getElementById("start-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Loading Questions...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        
        // Show test interface
        document.getElementById("screen-exam-title").textContent = examName;
        renderOMR(totalQs);
        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("exam-screen").classList.remove("hidden");

        // Render PDF directly to HTML5 Canvas
        await renderPdfToCanvas(arrayBuffer);
        initClock(totalMins * 60);
      } catch (err) {
        console.error(err);
        alert("Error loading PDF: " + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Start Mock Exam";
      }
    });

    async function renderPdfToCanvas(arrayBuffer) {
      const pdfContainer = document.getElementById("pdf-container");
      pdfContainer.innerHTML = "";

      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        
        // Scale for mobile screens: Render crisp 1.5x resolution
        const initialViewport = page.getViewport({ scale: 1 });
        const screenWidth = Math.min(window.innerWidth, 800) - 24;
        const scale = screenWidth / initialViewport.width;
        const viewport = page.getViewport({ scale: Math.max(scale, 1.2) });

        const canvas = document.createElement("canvas");
        canvas.className = "pdf-page-canvas";
        const context = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        pdfContainer.appendChild(canvas);

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;
      }
    }

    function renderOMR(total) {
      const container = document.getElementById("sheet-items");
      container.innerHTML = "";
      userAnswers = {};

      for (let i = 1; i <= total; i++) {
        userAnswers[i] = null;

        const row = document.createElement("div");
        row.className = "omr-item";
        row.id = `row-${i}`;

        const index = document.createElement("span");
        index.className = "omr-index";
        index.textContent = `Q${i}`;
        row.appendChild(index);

        const bubbles = document.createElement("div");
        bubbles.className = "bubble-row";

        ["A", "B", "C", "D"].forEach((opt) => {
          const btn = document.createElement("div");
          btn.className = "bubble";
          btn.textContent = opt;
          btn.id = `opt-${i}-${opt}`;
          btn.onclick = () => chooseAnswer(i, opt);
          bubbles.appendChild(btn);
        });

        row.appendChild(bubbles);
        container.appendChild(row);
      }
    }

    function chooseAnswer(qNum, option) {
      const row = document.getElementById(`row-${qNum}`);
      const isSelected = userAnswers[qNum] === option;

      ["A", "B", "C", "D"].forEach((opt) => {
        document.getElementById(`opt-${qNum}-${opt}`).classList.remove("active");
      });

      if (isSelected) {
        userAnswers[qNum] = null;
        row.classList.remove("answered");
      } else {
        userAnswers[qNum] = option;
        document.getElementById(`opt-${qNum}-${option}`).classList.add("active");
        row.classList.add("answered");
      }
    }

    function initClock(totalSec) {
      secondsLeft = totalSec;
      initialSeconds = totalSec;
      const display = document.getElementById("clock-display");

      function tick() {
        const hrs = Math.floor(secondsLeft / 3600);
        const mins = Math.floor((secondsLeft % 3600) / 60);
        const secs = secondsLeft % 60;

        display.textContent = 
          `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;

        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          endTest(true);
        }
        secondsLeft--;
      }

      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    function endTest(forced) {
      if (!forced && !confirm("Do you want to finish and submit the test?")) {
        return;
      }

      clearInterval(countdownInterval);

      const total = Object.keys(userAnswers).length;
      let answered = 0;
      for (const k in userAnswers) {
        if (userAnswers[k] !== null) answered++;
      }

      const elapsed = initialSeconds - Math.max(0, secondsLeft);
      const minsSpent = Math.floor(elapsed / 60);
      const secsSpent = elapsed % 60;

      document.getElementById("res-total").textContent = total;
      document.getElementById("res-attempted").textContent = answered;
      document.getElementById("res-unattempted").textContent = total - answered;
      document.getElementById("res-time").textContent = `${minsSpent}m ${secsSpent}s`;

      document.getElementById("exam-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
    }
  </script>
</body>
</html>
